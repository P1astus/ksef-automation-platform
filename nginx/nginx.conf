events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Resolve container names per request through Docker's embedded DNS.
    # A static upstream is resolved once at startup; after the portal
    # container is recreated (new IP) nginx would answer 502 until restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;


    server {
        listen 80;
        server_name localhost;

        set $portal_upstream http://ksef_portal:3000;

        # nginx's default is 1m, which rejects any real scanned invoice (or a
        # client's document upload) with a 413 before the portal ever sees it.
        # The portal enforces its own 10 MB cap (lib/file-storage.ts).
        client_max_body_size 12m;

        # Web Portal
        location / {
            proxy_pass $portal_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            # Do not pass through client-supplied forwarding headers. The
            # portal's IP-keyed throttles use X-Real-IP, which nginx derives
            # from the TCP peer before proxying.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
