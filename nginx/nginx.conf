events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream portal {
        server ksef_portal:3000;
    }

    upstream n8n {
        server n8n:5678;
    }

    server {
        listen 80;
        server_name localhost;

        # nginx's default is 1m, which rejects any real scanned invoice (or a
        # client's document upload) with a 413 before the portal ever sees it.
        # The portal enforces its own 10 MB cap (lib/file-storage.ts).
        client_max_body_size 12m;

        # Web Portal
        location / {
            proxy_pass http://portal;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            # Do not pass through client-supplied forwarding headers. The
            # portal's IP-keyed throttles use X-Real-IP, which nginx derives
            # from the TCP peer before proxying.
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
        }

        # n8n Webhooks (for KSeF callbacks to work from the internet)
        # Note: the UI is blocked
        location /webhook/ {
            proxy_pass http://n8n/webhook/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        location /webhook-test/ {
            proxy_pass http://n8n/webhook-test/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
