server:
  port: 8090

spring:
  application:
    name: ksef-xades-sidecar

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

ksef:
  environment: ${KSEF_ENVIRONMENT:test}

sidecar:
  api-key: ${SIDECAR_API_KEY:}
  # XAdES-BES signing of the MF JPK gateway's InitUpload metadata. Unset = the
  # /sign-xades-bes endpoint answers 503. The key is server-side only.
  jpk-signing:
    keystore-path: ${JPK_SIGNING_KEYSTORE_PATH:}
    keystore-password: ${JPK_SIGNING_KEYSTORE_PASSWORD:}
