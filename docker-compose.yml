name: ksef-automation-platform

# The portal image is built from the repository root so it can carry db/ (the schema) and the migration
# runner. The root .dockerignore is a whitelist (portal/ and db/ only). portal and ksef_migrate share this
# build and image tag, so it is built once.
x-portal-build: &portal-build
  context: .
  dockerfile: portal/Dockerfile

services:
  portal:
    build: *portal-build
    image: ksef-portal:local
    container_name: ksef_portal
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://ksef_app:${KSEF_DB_PASSWORD}@ksef_db:5432/ksef_platform
      # Deployment edition (lib/deployment.ts). Empty = hosted SaaS with Stripe access, exactly as before.
      # A bad value stops the app at first use; a Stripe key with a non-Stripe ACCESS_PROVIDER is refused.
      - "DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-}"
      - "ACCESS_PROVIDER=${ACCESS_PROVIDER:-}"
      - "EMAIL_TRANSPORT=${EMAIL_TRANSPORT:-}"
      - "PUBLIC_UPLOAD_ENABLED=${PUBLIC_UPLOAD_ENABLED:-}"
      - "SCHEDULER_ENABLED=${SCHEDULER_ENABLED:-}"
      # Which jobs the worker runs for real. The portal reads it to know whether a manual client sync can be queued for the worker.
      - "JOBS_ENABLED=${JOBS_ENABLED:-}"
      - "JOB_SECRET=${JOB_SECRET:-}"
      - "JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env - generate with: openssl rand -hex 32}"
      - KSEF_ENVIRONMENT=${KSEF_ENVIRONMENT:-test}
      # Hyphenated hostname, not the underscored container_name below -
      # Tomcat's embedded HTTP parser 400s on any Host header containing an
      # underscore (see ksef-client.ts). "xades-sidecar" is the service name
      # in this file and Compose always registers it as a DNS alias too.
      - XADES_SIDECAR_URL=http://xades-sidecar:8090
      - "SIDECAR_API_KEY=${SIDECAR_API_KEY:?SIDECAR_API_KEY must be set in .env - generate with: openssl rand -hex 32}"
      - "NOTIFY_SECRET=${NOTIFY_SECRET:-}"
      - "KSEF_CREDENTIALS_KEY=${KSEF_CREDENTIALS_KEY:-}"
      # The portal image ships no .env file (.dockerignore excludes .env*), so
      # every optional variable the portal reads has to be passed through here
      # or it can never reach the container, whatever the root .env says.
      # Unset means "feature not configured" - the routes that need one fail
      # loudly (503) rather than pretending. Public origin used to build every
      # emailed/redirect link (invites, reset, document requests, Stripe).
      - "NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-}"
      - "RESEND_API_KEY=${RESEND_API_KEY:-}"
      - "RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-}"
      - "SMTP_HOST=${SMTP_HOST:-}"
      - "SMTP_PORT=${SMTP_PORT:-587}"
      - "SMTP_SECURE=${SMTP_SECURE:-false}"
      - "SMTP_USER=${SMTP_USER:-}"
      - "SMTP_PASSWORD=${SMTP_PASSWORD:-}"
      - "SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}"
      - "SMTP_CHECK_TO=${SMTP_CHECK_TO:-}"
      - "ALLOW_DEV_RESET_URL=${ALLOW_DEV_RESET_URL:-false}"
      - "DIGEST_SECRET=${DIGEST_SECRET:-}"
      - "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}"
      - "STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}"
      - "STRIPE_PRICE_START=${STRIPE_PRICE_START:-}"
      - "STRIPE_PRICE_BIZNES=${STRIPE_PRICE_BIZNES:-}"
      - "STRIPE_PRICE_PRO=${STRIPE_PRICE_PRO:-}"
      - "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}"
      - "N8N_SYNC_WEBHOOK_URL=${N8N_SYNC_WEBHOOK_URL:-}"
      # Deliberately default-off, server-only switch for the MF JPK TEST
      # gateway. This never enables a production endpoint.
      - "JPK_TEST_GATEWAY_ENABLED=${JPK_TEST_GATEWAY_ENABLED:-false}"
      # Public MF TEST encryption certificate (PEM). This is not a taxpayer
      # certificate; leave empty while the feature flag is disabled.
      - "JPK_TEST_GATEWAY_CERTIFICATE_PEM=${JPK_TEST_GATEWAY_CERTIFICATE_PEM:-}"
      - "JPK_TEST_GATEWAY_CERTIFICATE_BASE64=${JPK_TEST_GATEWAY_CERTIFICATE_BASE64:-}"
    volumes:
      # OCR/email/tokened-upload source documents (ocr_queue.file_path) -
      # a named volume so they survive a portal rebuild, unlike the
      # container's writable layer.
      - ocr_uploads:/app/uploads
    depends_on:
      ksef_db:
        condition: service_healthy
      # The schema must exist before the portal serves anything. If migration fails, the portal never starts.
      ksef_migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    container_name: ksef_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - portal
      - n8n
  postgres:
    image: postgres:16-alpine
    container_name: n8n_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U n8n" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ksef_db:
    image: postgres:16-alpine
    container_name: ksef_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ksef_platform
      - POSTGRES_USER=ksef_app
      - POSTGRES_PASSWORD=${KSEF_DB_PASSWORD}
    volumes:
      - ksef_db_data:/var/lib/postgresql/data
      # No docker-entrypoint-initdb.d mounts: initdb scripts ran only on an empty volume and covered only the
      # base schema, so a fresh install had no `firms` table. Schema is applied by ksef_migrate (db/).
    ports:
      - "5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ksef_app -d ksef_platform" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # The job worker: replaces n8n's scheduler, one job at a time as they are ported (see the plan). Same image as the
  # portal, different command. INERT by default: JOBS_ENABLED and JOBS_SHADOW are empty, so it starts, logs "idle" and
  # runs nothing. A typo in either stops it with exit 78 instead of running a subset. Never enable a job here while the
  # n8n workflow it replaces is still active - they would both do the work.
  ksef_worker:
    build: *portal-build
    image: ksef-portal:local
    container_name: ksef_worker
    restart: unless-stopped
    command: ["node", "worker.js"]
    environment:
      - DATABASE_URL=postgresql://ksef_app:${KSEF_DB_PASSWORD}@ksef_db:5432/ksef_platform
      # Deadline and schedule logic is Warsaw-local; the portal container has no TZ, the worker must.
      - TZ=Europe/Warsaw
      - "JOBS_ENABLED=${JOBS_ENABLED:-}"
      - "JOBS_SHADOW=${JOBS_SHADOW:-}"
      # Where alerts are e-mailed. No default: with it unset alerts are still stored and the gap is recorded on them.
      - "ALERT_EMAIL=${ALERT_EMAIL:-}"
      - "JOBS_TICK_SECONDS=${JOBS_TICK_SECONDS:-}"
      - "JOBS_LEASE_SECONDS=${JOBS_LEASE_SECONDS:-}"
      - "KSEF_ENVIRONMENT=${KSEF_ENVIRONMENT:-test}"
      - XADES_SIDECAR_URL=http://xades-sidecar:8090
      # invoice-retrieval (replaces workflows 02+04): authenticates to KSeF through the sidecar and decrypts stored tokens.
      - "SIDECAR_API_KEY=${SIDECAR_API_KEY:?SIDECAR_API_KEY must be set in .env - generate with: openssl rand -hex 32}"
      - "KSEF_CREDENTIALS_KEY=${KSEF_CREDENTIALS_KEY:-}"
      - "DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-}"
      - "EMAIL_TRANSPORT=${EMAIL_TRANSPORT:-}"
      - "NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-}"
      - "RESEND_API_KEY=${RESEND_API_KEY:-}"
      - "RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL:-}"
      - "SMTP_HOST=${SMTP_HOST:-}"
      - "SMTP_PORT=${SMTP_PORT:-587}"
      - "SMTP_SECURE=${SMTP_SECURE:-false}"
      - "SMTP_USER=${SMTP_USER:-}"
      - "SMTP_PASSWORD=${SMTP_PASSWORD:-}"
      - "SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}"
    depends_on:
      ksef_db:
        condition: service_healthy
      ksef_migrate:
        condition: service_completed_successfully

  # One-shot: applies db/baseline-2026-09-20.sql to an empty database, or audits-then-adopts an existing one,
  # then any post-cutover migrations. `docker compose run --rm ksef_migrate` runs it by hand. An existing
  # database needs MIGRATIONS_CONFIRM_ADOPTION=1 once, after a backup - see INSTALL.md.
  ksef_migrate:
    build: *portal-build
    image: ksef-portal:local
    container_name: ksef_migrate
    restart: "no"
    command: ["node", "scripts/migrate.mjs"]
    environment:
      - DATABASE_URL=postgresql://ksef_app:${KSEF_DB_PASSWORD}@ksef_db:5432/ksef_platform
      - "MIGRATIONS_CONFIRM_ADOPTION=${MIGRATIONS_CONFIRM_ADOPTION:-}"
      - "MIGRATIONS_ALLOW_CHECKSUM_DRIFT=${MIGRATIONS_ALLOW_CHECKSUM_DRIFT:-}"
    depends_on:
      ksef_db:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto,url,buffer,zlib
      - NODE_FUNCTION_ALLOW_EXTERNAL=fast-xml-parser,xml2js
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_PAYLOAD_SIZE_MAX=64
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=2160
      - GENERIC_TIMEZONE=Europe/Warsaw
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_API_KEY=${N8N_API_KEY}
      # D7: workflows read the KSeF API base from $env.KSEF_API_BASE instead of
      # 27 hardcoded URLs across 4 files. $vars (n8n's Variables feature) would
      # be the safer mechanism since it isn't gated by the env-access block
      # below, but it requires an Enterprise license - this is Community
      # edition. N8N_BLOCK_ENV_ACCESS_IN_NODE defaults to true as of n8n v2.0
      # specifically to stop workflows reading secrets out of process.env;
      # false here is a deliberate, scoped exception for this one variable.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - KSEF_API_BASE=${KSEF_API_BASE:-https://api-test.ksef.mf.gov.pl}
      # Hyphenated, not the underscored container_name - see the portal
      # service's XADES_SIDECAR_URL comment above for why.
      - XADES_SIDECAR_URL=${XADES_SIDECAR_URL:-http://xades-sidecar:8090}
      - "SIDECAR_API_KEY=${SIDECAR_API_KEY:?SIDECAR_API_KEY must be set in .env - generate with: openssl rand -hex 32}"
      # Read by workflows/09-client-notifications.json's HTTP Request nodes
      # via $env.NOTIFY_SECRET (readable since N8N_BLOCK_ENV_ACCESS_IN_NODE
      # is already false above) to call the portal's notify/* routes.
      - "NOTIFY_SECRET=${NOTIFY_SECRET:-}"
      # Decrypts per-client KSeF credentials inside workflow 02. Must be the
      # same 32-byte key as the portal; never rotate without re-encrypting rows.
      - "KSEF_CREDENTIALS_KEY=${KSEF_CREDENTIALS_KEY:-}"
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_files:/files
    depends_on:
      postgres:
        condition: service_healthy
      ksef_db:
        condition: service_healthy
      ksef_migrate:
        condition: service_completed_successfully

  xades-sidecar:
    build: ./xades-sidecar
    container_name: xades_sidecar
    restart: unless-stopped
    environment:
      - KSEF_ENVIRONMENT=${KSEF_ENVIRONMENT:-test}
      # Round 4: this sidecar's crypto endpoints had no authentication at all
      # and are published on 0.0.0.0:8090 - now required on every request
      # except /actuator/** (see SidecarApiKeyFilter). Refuses to start
      # without it, same as the portal's JWT_SECRET requirement above.
      - "SIDECAR_API_KEY=${SIDECAR_API_KEY:?SIDECAR_API_KEY must be set in .env - generate with: openssl rand -hex 32}"
      # XAdES-BES signing of the MF JPK gateway's InitUpload metadata
      # (/sign-xades-bes). Server-side only - never accepted in a request.
      # Empty = the endpoint answers 503. Path is inside the container.
      - "JPK_SIGNING_KEYSTORE_PATH=${JPK_SIGNING_KEYSTORE_PATH:-}"
      - "JPK_SIGNING_KEYSTORE_PASSWORD=${JPK_SIGNING_KEYSTORE_PASSWORD:-}"
    ports:
      - "8090:8090"
    volumes:
      - ./certificates:/app/certificates

volumes:
  postgres_data:
  ksef_db_data:
  n8n_data:
  n8n_files:
  ocr_uploads:
